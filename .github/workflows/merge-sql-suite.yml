name: Manual↔Bank Merge SQL Suite

# Deploy gate for `merge_manual_with_bank` — the RPC that writes merged rows
# into the books. Same architecture as balance-sql-suite.yml: real Postgres 16,
# curated baseline + balance migrations, then the merge migration and the
# assertion harness (supabase/tests/merge/).

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/merge/**'
      - 'supabase/tests/krug_settle/**'
      - 'drizzle/migrations/**'
      - 'src/lib/manualBankMergePair.ts'
      - 'src/lib/mergeOfferCandidate.ts'
      - 'src/lib/featureFlags.ts'
      - '.github/workflows/merge-sql-suite.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/merge/**'
      - 'supabase/tests/krug_settle/**'
      - 'drizzle/migrations/**'
      - 'src/lib/manualBankMergePair.ts'
      - 'src/lib/mergeOfferCandidate.ts'
      - 'src/lib/featureFlags.ts'
      - '.github/workflows/merge-sql-suite.yml'

jobs:
  merge-sql:
    name: Merge SQL suite (postgres:16, curated baseline)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: merge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: merge_test

    steps:
      - uses: actions/checkout@v4

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres && exit 0
            sleep 1
          done
          echo "Postgres did not become ready" >&2
          exit 1

      - name: Run merge SQL harness
        run: |
          set -euo pipefail
          bash supabase/tests/merge/run.sh 2>&1 | tee /tmp/merge.out
          # Hvata i goli "ERROR:" (stdin ulaz nema psql: prefiks).
          if grep -E '^(psql:.*ERROR|ERROR:|FAIL )' /tmp/merge.out; then
            echo "Merge SQL suite reported failures" >&2
            exit 1
          fi
          # Brojčana brana: tiho neizvršeni scenariji ne smiju dati zeleno.
          # Očekivani minimum: 39 PASS tvrdnji (izmjereno 24.09.2026 nakon
          # 4.13a/b/c; podići kad se dodaju scenariji).
          pass_count=$(grep -c 'PASS ' /tmp/merge.out || true)
          if [ "$pass_count" -lt 39 ]; then
            echo "Merge SQL suite ran only $pass_count assertions (expected >= 39) — silent scenario loss" >&2
            exit 1
          fi
          echo "Merge SQL suite: $pass_count assertions PASS"

      - name: Run Krug settle-with-source SQL guards
        run: |
          set -euo pipefail
          psql -d postgres -c "DROP DATABASE IF EXISTS krug_settle_test" -c "CREATE DATABASE krug_settle_test"
          PGDATABASE=krug_settle_test bash supabase/tests/krug_settle/run.sh 2>&1 | tee /tmp/krug_settle.out
          if grep -E '^(psql:.*ERROR|ERROR:|FAIL )' /tmp/krug_settle.out; then
            echo "Krug settle SQL guards reported failures" >&2
            exit 1
          fi
          pass_count=$(grep -c 'PASS G' /tmp/krug_settle.out || true)
          if [ "$pass_count" -lt 45 ]; then
            echo "Krug settle guards ran only $pass_count assertions (expected >= 45)" >&2
            exit 1
          fi
          echo "Krug settle guards: $pass_count assertions PASS"

      - name: Run work-entry notify + worker link SQL guards
        run: |
          set -euo pipefail
          psql -d postgres -c "DROP DATABASE IF EXISTS work_entry_notify_test" -c "CREATE DATABASE work_entry_notify_test"
          PGDATABASE=work_entry_notify_test bash supabase/tests/work_entry_notify/run.sh 2>&1 | tee /tmp/wen.out
          if grep -E '^(psql:.*ERROR|ERROR:|FAIL )' /tmp/wen.out; then
            echo "Work entry notify guards reported failures" >&2
            exit 1
          fi
          pass_count=$(grep -c 'PASS W' /tmp/wen.out || true)
          if [ "$pass_count" -lt 4 ]; then
            echo "Work entry notify guards ran only $pass_count assertions (expected >= 4)" >&2
            exit 1
          fi
          echo "Work entry notify guards: $pass_count assertions PASS"
